name: Publish Update Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout update files
        uses: actions/checkout@v4

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Ssamtang ${{ github.ref_name }}
          files: |
            Ssamtang-Setup-*.exe
            Ssamtang-Setup-*.exe.blockmap
            latest.yml
